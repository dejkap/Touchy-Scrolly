<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Válec</title>
<meta name="theme-color" content="#0d0e10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Válec">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root{
    --bg:#0d0e10; --panel:#17191c; --line:#2a2d32; --text:#e8e6e1; --muted:#8b8f96; --accent:#c9a96e;
    --hous1:#1d1f23; --hous2:#121316; --well:#060708;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; height:100%; background:var(--bg); color:var(--text);
    font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    overflow:hidden; overscroll-behavior:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    transition:background .3s}
  body{position:fixed; inset:0}
  button{font:inherit; color:inherit}
  #app{position:absolute; inset:0;
    padding: calc(env(safe-area-inset-top) + 58px) calc(env(safe-area-inset-right) + 14px)
             calc(env(safe-area-inset-bottom) + 26px) calc(env(safe-area-inset-left) + 14px);
    display:flex}
  #housing{flex:1; position:relative; border-radius:22px;
    background:linear-gradient(180deg,var(--hous1),var(--hous2));
    box-shadow: 0 1px 0 rgba(255,255,255,.06) inset, 0 -1px 0 rgba(0,0,0,.3) inset, 0 20px 40px rgba(0,0,0,.35)}
  #field,#pad{position:absolute; inset:10px; border-radius:14px; overflow:hidden; background:var(--well); touch-action:none}
  #field{cursor:grab}
  #field.drag{cursor:grabbing}
  #cv{position:absolute; inset:0; width:100%; height:100%; display:block}
  #field::after{content:""; position:absolute; inset:0; pointer-events:none; border-radius:14px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.5), inset 0 6px 14px -6px rgba(0,0,0,.6)}
  #busy{position:absolute; inset:0; display:grid; place-items:center; color:var(--muted); font-size:13px;
    letter-spacing:.08em; text-transform:uppercase; pointer-events:none}
  #fx{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:1}

  /* mode visibility */
  #pad{display:none}
  body[data-mode="pad"] #pad{display:grid}
  body[data-mode="pad"] #field{display:none}
  body[data-mode="roll"] [data-for="pad"], body[data-mode="pad"] [data-for="roll"]{display:none}

  /* top bar */
  #top{position:absolute; top:calc(env(safe-area-inset-top) + 8px); left:calc(env(safe-area-inset-left) + 14px);
    right:calc(env(safe-area-inset-right) + 14px); height:42px; z-index:2; display:flex; align-items:center; justify-content:space-between}
  .iconbtn{width:42px; height:42px; border-radius:12px; border:1px solid var(--line); background:var(--panel);
    display:grid; place-items:center; padding:0; cursor:pointer}
  .iconbtn svg,.seg svg{width:20px; height:20px}
  .seg{display:inline-flex; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:3px; gap:2px}
  .seg button{border:0; background:transparent; border-radius:9px; padding:7px 11px; cursor:pointer; color:var(--muted); display:grid; place-items:center}
  .seg button[aria-pressed="true"]{background:var(--line); color:var(--text)}
  .seg.wide{display:flex}
  .seg.wide button{flex:1; font-size:13px; padding:9px 4px}

  /* sheet */
  #scrim{position:fixed; inset:0; z-index:3; background:rgba(0,0,0,.4); opacity:0; pointer-events:none; transition:opacity .2s}
  #sheet{position:fixed; z-index:4; left:0; right:0; bottom:0; max-height:84%; overflow:auto; -webkit-overflow-scrolling:touch;
    background:var(--panel); border-top:1px solid var(--line); border-radius:20px 20px 0 0;
    padding:10px 18px calc(env(safe-area-inset-bottom) + 20px);
    transform:translateY(105%); transition:transform .25s cubic-bezier(.2,.8,.2,1)}
  body.open #scrim{opacity:1; pointer-events:auto}
  body.open #sheet{transform:none}
  .grab{width:40px; height:4px; border-radius:2px; background:var(--line); margin:2px auto 8px}
  h2{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600; margin:18px 0 10px}
  #mats{display:grid; grid-template-columns:repeat(auto-fill,minmax(92px,1fr)); gap:10px}
  #mats h3{grid-column:1/-1; margin:6px 2px -2px; font-size:12px; font-weight:500; color:var(--muted)}
  .mat{border:1px solid var(--line); border-radius:14px; padding:6px; background:var(--bg); text-align:left; cursor:pointer}
  .mat canvas{width:100%; aspect-ratio:1; border-radius:9px; display:block; background:#222}
  .mat b{display:block; font-size:13px; font-weight:600; margin:6px 2px 0}
  .mat small{display:block; font-size:11px; color:var(--muted); margin:0 2px 2px}
  .mat[aria-pressed="true"]{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent)}
  .swatches{display:flex; flex-wrap:wrap; gap:10px}
  .swatches button,.swatches label{width:38px; height:38px; border-radius:50%; border:2px solid var(--line); padding:0; cursor:pointer; position:relative}
  .swatches [aria-pressed="true"]{border-color:var(--text); box-shadow:0 0 0 2px var(--panel) inset}
  .swatches label{display:grid; place-items:center; background:conic-gradient(#f66,#fd6,#6f8,#6cf,#a6f,#f66); overflow:hidden}
  .swatches label input{position:absolute; inset:0; opacity:0; width:100%; height:100%; cursor:pointer}
  .swatches label span{width:16px; height:16px; border-radius:50%; background:var(--panel); display:grid; place-items:center; font-size:14px; line-height:1}
  .row{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 0; border-top:1px solid var(--line)}
  .row span small{display:block; color:var(--muted); font-size:12px}
  .sw{appearance:none; -webkit-appearance:none; width:48px; height:28px; border-radius:14px; background:var(--line);
    position:relative; cursor:pointer; transition:background .15s; flex:none; margin:0}
  .sw::after{content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:#fff; transition:transform .15s}
  .sw:checked{background:#a8926a}
  .sw:checked::after{transform:translateX(20px)}
  .quiet{font-size:12px; color:var(--muted); opacity:.6; margin:22px 2px 0; font-variant-numeric:tabular-nums}

  /* button pad */
  #pad{grid-template-columns:repeat(var(--n),var(--cell)); grid-template-rows:repeat(var(--n),var(--cell)); gap:var(--gap); padding:var(--gap);
    justify-content:center; align-content:center; --cell:60px}
  .pb{--lc:255,184,108; position:relative; border-radius:var(--r); border:var(--bw) solid; padding:0; margin:0; cursor:pointer;
    transition:transform .07s, box-shadow .07s; touch-action:none}
  #pad.dark .pb{background:linear-gradient(180deg,#484b51,#35373c); border-color:#696c72;
    box-shadow:0 3px 0 #141519, 0 7px 14px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.1)}
  #pad.light .pb{background:linear-gradient(180deg,#f6f5f2,#dfddd8); border-color:#c2c0bb;
    box-shadow:0 3px 0 #a8a6a1, 0 7px 14px rgba(0,0,0,.16), inset 0 1px 0 #fff}
  .pb.down{transform:translateY(2px) scale(.985)}
  #pad.dark .pb.down{box-shadow:0 1px 0 #141519, 0 2px 5px rgba(0,0,0,.3), inset 0 2px 8px rgba(0,0,0,.35)}
  #pad.light .pb.down{box-shadow:0 1px 0 #a8a6a1, 0 2px 5px rgba(0,0,0,.12), inset 0 2px 8px rgba(0,0,0,.12)}
  .glow,.halo{position:absolute; pointer-events:none; opacity:0; transition:opacity .9s ease-out}
  .glow{inset:0; border-radius:calc(var(--r) - var(--bw));
    background:radial-gradient(circle at 50% 48%, rgba(255,255,255,.9) 0%, rgba(var(--lc),1) 18%, rgba(var(--lc),.7) 55%, rgba(var(--lc),.35) 100%)}
  .halo{inset:calc(var(--bw) * -1); border-radius:var(--r);
    box-shadow:0 0 24px 4px rgba(var(--lc),.7), 0 0 0 var(--bw) rgba(var(--lc),.95)}
  .pb.on .glow,.pb.on .halo{opacity:1; transition:opacity .2s}
</style>
</head>
<body data-mode="roll">
<div id="top">
  <div class="seg" id="modeSeg">
    <button data-mode="roll" aria-label="Válec"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><ellipse cx="17" cy="12" rx="3" ry="8"/><path d="M17 4H7c-1.7 0-3 3.6-3 8s1.3 8 3 8h10"/></svg></button>
    <button data-mode="pad" aria-label="Tlačítka"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg></button>
  </div>
  <button class="iconbtn" id="gear" aria-label="Nastavení">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
  </button>
</div>

<main id="app">
  <div id="housing">
    <div id="field"><canvas id="cv"></canvas><div id="busy">Tesám…</div></div>
    <div id="pad"></div>
  </div>
</main>
<canvas id="fx"></canvas>

<div id="scrim"></div>
<section id="sheet" aria-label="Nastavení">
  <div class="grab"></div>

  <div data-for="roll">
    <h2>Co se točí</h2>
    <div id="mats"></div>
    <div id="tintBox"><h2 id="tintTitle">Barva</h2><div class="swatches" id="tintSw"></div></div>
    <div id="fxBox"><h2>Při rychlém točení odlétá</h2>
    <div class="seg wide" data-k="fx"><button data-v="none">Nic</button><button data-v="sparks">Jiskry</button><button data-v="glitter">Třpytky</button><button data-v="dust">Prach</button></div></div>
  </div>

  <div data-for="pad">
    <h2>Počet tlačítek</h2>
    <div class="seg wide" data-k="grid" data-num="1"><button data-v="2">2×2</button><button data-v="3">3×3</button><button data-v="4">4×4</button><button data-v="5">5×5</button><button data-v="6">6×6</button><button data-v="7">7×7</button></div>
    <h2>Tlačítka</h2>
    <div class="seg wide" data-k="padStyle"><button data-v="dark">Tmavá</button><button data-v="light">Světlá</button></div>
    <h2>Světlo</h2>
    <div class="swatches" id="lightSw"></div>
    <h2>Po kliknutí</h2>
    <div class="seg wide" data-k="padMode"><button data-v="fade">Pohasne</button><button data-v="toggle">Zůstane svítit</button></div>
    <label class="row" style="margin-top:8px"><span>Vlna do okolí<small>sousední tlačítka se lehce rozsvítí</small></span><input type="checkbox" class="sw" data-k="wave"></label>
  </div>

  <h2>Barva aplikace</h2>
  <div class="swatches" id="themeSw"></div>

  <h2>Pocit</h2>
  <label class="row"><span>Zvuk<small>každý materiál zní po svém</small></span><input type="checkbox" class="sw" data-k="sound"></label>
  <label class="row" data-for="roll"><span>Cvakání<small>jemná aretace jako u kolečka myši</small></span><input type="checkbox" class="sw" data-k="ticks"></label>
  <label class="row"><span>Vibrace<small>jen Android – iPhone je z webu nepovolí</small></span><input type="checkbox" class="sw" data-k="haptics"></label>

  <p class="quiet" id="stats"></p>
</section>

<script>
"use strict";
/* ================================================================
   Materials: look + feel (physics) + sound
   mass – inertia (how slowly it follows the finger)
   k    – viscous drag after release (1/s)
   c    – dry friction after release (px/s²)
   gloss/shine – highlight; sheen – velvet rim light
   bumps – seams per revolution (texture drawn to match), stone – gets wear
   face  – what the side of the wheel is made of ("lid" = barrel lid, "wood" = spool)
   ================================================================ */
const MATERIALS = [
  {id:"solid", group:"color", name:"Barva", note:"čisté kolo, vlastní barva", tint:true, mass:4, k:0.5, c:60, gloss:.32, shine:30,
    snd:{src:"brown", f:[["lowpass",380,.7]], g:.3, pitch:.5}},
  {id:"velvet", group:"color", name:"Samet", note:"hebký, barvu si vybereš", tint:true, mass:2.4, k:1.8, c:200, gloss:.04, shine:10, sheen:.32,
    snd:{src:"white", f:[["bandpass",1100,.6],["lowpass",3000,.7]], g:.08, pitch:.3}},

  {id:"barrel", group:"warm", name:"Sud", note:"dubové dužiny, obruče", face:"lid", mass:5, k:0.6, c:70, gloss:.1, shine:18, bumps:18,
    snd:{src:"brown", f:[["lowpass",340,.7],["peaking",120,2.5,8]], g:.55, pitch:.5, bump:"knock", bumpG:.5}},
  {id:"wood", group:"warm", name:"Dub", note:"lehký, hladký", mass:2.2, k:0.9, c:120, gloss:.12, shine:20,
    snd:{src:"brown", f:[["bandpass",520,.9]], g:.4, pitch:.8}},
  {id:"cork", fx:"crumbs", group:"warm", name:"Korek", note:"lehoučký, pruží", mass:1.4, k:1.3, c:150, gloss:.02, shine:8,
    snd:{src:"white", f:[["bandpass",1500,.8],["lowpass",3500,.7]], g:.14, pitch:.5, crackle:.25}},
  {id:"felt", group:"warm", name:"Plsť", note:"měkká, tiše šustí", mass:2, k:2.2, c:260, gloss:0, shine:8,
    snd:{src:"white", f:[["highpass",1800,.5],["lowpass",5000,.6]], g:.09, pitch:.3}},
  {id:"leather", group:"warm", name:"Kůže", note:"koňak, se švem", mass:3, k:1.4, c:160, gloss:.16, shine:16,
    snd:{src:"brown", f:[["bandpass",650,.8]], g:.25, pitch:.6}},
  {id:"rope", fx:"fibers", group:"warm", name:"Juta", note:"navinutý provaz", face:"wood", mass:3, k:1.5, c:180, gloss:0, shine:8, bumps:64,
    snd:{src:"brown", f:[["bandpass",800,.7]], g:.25, pitch:.7, bump:"fiber", bumpG:.25}},
  {id:"rubber", group:"warm", name:"Guma", note:"lepí se, hned stojí", mass:1.2, k:3.2, c:520, gloss:.06, shine:12, bumps:48,
    snd:{src:"brown", f:[["lowpass",160,.7]], g:.5, pitch:.4, bump:"thud", bumpG:.35}},

  {id:"granite", fx:"stone", group:"stone", stone:true, name:"Žula šedá", note:"těžká, dlouho dobíhá", mass:6, k:0.35, c:40, gloss:.22, shine:40,
    snd:{src:"white", f:[["bandpass",520,.8]], g:.4, pitch:1, crackle:.5}},
  {id:"granite-red", fx:"stone", group:"stone", stone:true, name:"Žula růžová", note:"těžká, hrubší", mass:6.5, k:0.45, c:60, gloss:.18, shine:30,
    snd:{src:"white", f:[["bandpass",460,.8]], g:.45, pitch:1, crackle:.7}},
  {id:"sandstone", fx:"sand", group:"stone", stone:true, name:"Pískovec", note:"teplý kámen, písčitý", mass:5.5, k:0.7, c:110, gloss:.02, shine:8,
    snd:{src:"white", f:[["bandpass",900,.6]], g:.35, pitch:.9, crackle:1.2}},
  {id:"marble", fx:"powder", group:"stone", stone:true, name:"Mramor", note:"leštěný, klouže", mass:5, k:0.28, c:30, gloss:.45, shine:70,
    snd:{src:"white", f:[["bandpass",1100,1.4]], g:.2, pitch:.8, crackle:.08}},
  {id:"concrete", fx:"sand", group:"stone", stone:true, name:"Beton", note:"drhne, rychle staví", mass:7, k:1.0, c:230, gloss:.04, shine:10,
    snd:{src:"white", f:[["bandpass",320,.6]], g:.55, pitch:1, crackle:1}},
  {id:"steel", fx:"sparks", group:"stone", name:"Ocel", note:"na ložiskách, točí se věčně", mass:8, k:0.12, c:12, gloss:.6, shine:28,
    snd:{src:"white", f:[["bandpass",2600,6]], g:.07, pitch:.6, whine:.06}},
];
const GROUPS = [["color","Barevné"],["warm","Teplé a měkké"],["stone","Kámen a kov"]];
const TINTS  = ["#141414","#eeece6","#76202c","#1f4a36","#1e3a6e","#c08a2e","#a4472f","#8a7bb5"];
const THEMES = ["#0d0e10","#10172a","#132016","#1d1220","#1e1611","#3a3f45","#e9e2d6","#dfe4e8"];
const LIGHTS = ["#ffb86c","#fff1c9","#8cc4ff","#ff7a8a","#a6f0a0","rainbow"];

/* ---------------- settings + stats ---------------- */
const DEFAULTS = {mode:"roll", mat:"granite", tint:{solid:"#141414", velvet:"#76202c"}, view:"3d", fx:"sparks",
  theme:"#0d0e10", sound:true, ticks:false, haptics:true, grid:6, padStyle:"dark", light:"#ffb86c", padMode:"fade", wave:true};
let S = JSON.parse(JSON.stringify(DEFAULTS));
try { const st=JSON.parse(localStorage.getItem("valec-settings")||"{}"); Object.assign(S, st); S.tint={...DEFAULTS.tint, ...(st.tint||{})}; } catch(e){}
const save = () => { try { localStorage.setItem("valec-settings", JSON.stringify(S)); } catch(e){} };
let STATS = {turns:0, clicks:0};
try { Object.assign(STATS, JSON.parse(localStorage.getItem("valec-stats")||"{}")); } catch(e){}
const saveStats = () => { try { localStorage.setItem("valec-stats", JSON.stringify(STATS)); } catch(e){} };
setInterval(saveStats, 3000); document.addEventListener("visibilitychange", saveStats);
const matById = id => MATERIALS.find(m=>m.id===id) || MATERIALS[0];

/* ---------------- colour helpers ---------------- */
const hex2rgb = h => { h=h.replace("#",""); if(h.length===3) h=h.split("").map(c=>c+c).join(""); const n=parseInt(h,16); return [n>>16&255, n>>8&255, n&255]; };
const mix = (a,b,t) => a.map((v,i)=>Math.round(v+(b[i]-v)*t));
const css = c => `rgb(${c[0]},${c[1]},${c[2]})`;
const lum = c => (.2126*c[0]+.7152*c[1]+.0722*c[2])/255;

/* ---------------- tileable noise ---------------- */
function hash(x,y,s){
  let h = Math.imul(x,374761393) ^ Math.imul(y,668265263) ^ Math.imul(s,982451653);
  h = Math.imul(h ^ (h>>>13), 1274126177); h ^= h>>>16;
  return (h>>>0)/4294967296;
}
function vnoise(x,y,cw,ch,py,s){
  const gx=x/cw, gy=y/ch, ix=Math.floor(gx), iy=Math.floor(gy);
  let fx=gx-ix, fy=gy-iy; fx=fx*fx*(3-2*fx); fy=fy*fy*(3-2*fy);
  const y0=((iy%py)+py)%py, y1=(y0+1)%py;
  const a=hash(ix,y0,s), b=hash(ix+1,y0,s), c=hash(ix,y1,s), d=hash(ix+1,y1,s);
  return a+(b-a)*fx + (c-a)*fy + (a-b-c+d)*fx*fy;
}
// periodic in y with period T; cell size cw×ch
const pnoise = (x,y,cw,ch,T,s) => { const n=Math.max(1,Math.round(T/ch)); return vnoise(x,y,cw,T/n,n,s); };
function fbm(x,y,cw,ch,T,oct,s){
  let sum=0, amp=1, norm=0;
  for(let o=0;o<oct;o++){ sum+=amp*pnoise(x,y,cw,ch,T,s+o*17); norm+=amp; amp*=.5; cw/=2; ch/=2; }
  return sum/norm;
}
function rng(seed){ let t=seed>>>0; return ()=>{ t+=0x6D2B79F5; let r=Math.imul(t^(t>>>15),1|t); r^=r+Math.imul(r^(r>>>7),61|r); return ((r^(r>>>14))>>>0)/4294967296; }; }
const clamp = v => v<0?0:v>255?255:v;

/* ---------------- texture generators ----------------
   W×T canvas, tileable in y (= around the wheel). x = along the axle.
   k = texture px per CSS px, keeps grain size the same on every screen */
function makeTexture(id, W, T, k, tint){
  const cv=document.createElement("canvas"); cv.width=W; cv.height=T;
  const g=cv.getContext("2d");
  const R=rng(1234 + id.length*99);
  const tc = tint ? hex2rgb(tint) : [128,128,128];

  const crystals = (base, palette, density, rmin, rmax) => {
    g.fillStyle=base; g.fillRect(0,0,W,T);
    const n = Math.round(W*T*density/(k*k));
    for(let i=0;i<n;i++){
      let p=R(), col=palette[palette.length-1][1];
      for(const [w,c] of palette){ if(p<w){col=c;break;} p-=w; }
      const x=R()*W, y=R()*T, r=(rmin+(rmax-rmin)*R()*R())*k;
      const sides=4+Math.floor(R()*4), rot=R()*6.28;
      g.fillStyle=col;
      const pts=[];
      for(let j=0;j<sides;j++){ const a=rot+j*6.283/sides+(R()-.5)*.6, rr=r*(.55+.6*R()); pts.push(Math.cos(a)*rr, Math.sin(a)*rr*(.7+.5*R())); }
      const offs=[0]; if(y<r*2) offs.push(T); if(y>T-r*2) offs.push(-T);
      for(const oy of offs){ g.beginPath(); for(let j=0;j<pts.length;j+=2) j?g.lineTo(x+pts[j],y+oy+pts[j+1]):g.moveTo(x+pts[j],y+oy+pts[j+1]); g.fill(); }
    }
  };
  const pixels = fn => {
    const im=g.getImageData(0,0,W,T), d=im.data;
    for(let y=0,i=0;y<T;y++) for(let x=0;x<W;x++,i+=4) fn(x,y,d,i);
    g.putImageData(im,0,0);
  };

  if(id==="solid"){
    pixels((x,y,d,i)=>{
      const m = 1 + (fbm(x,y,120*k,120*k,T,2,201)-.5)*.06, n=(hash(x,y,202)-.5)*7;
      d[i]=clamp(tc[0]*m+n); d[i+1]=clamp(tc[1]*m+n); d[i+2]=clamp(tc[2]*m+n); d[i+3]=255;
    });
  } else if(id==="velvet"){
    pixels((x,y,d,i)=>{
      const a = fbm(x,y,180*k,90*k,T,3,111);
      const v = (.8 + (a-.5)*.5 + (hash(x,y,112)-.5)*.08)*1.1;
      d[i]=clamp(tc[0]*v+4); d[i+1]=clamp(tc[1]*v+4); d[i+2]=clamp(tc[2]*v+4); d[i+3]=255;
    });
  } else if(id==="granite"){
    crystals("#8f8b86", [[.36,"#c9c6c0"],[.18,"#e4e1db"],[.22,"#77736e"],[.16,"#1d1c1c"],[.08,"#a59a8e"]], .045, 1.2, 4.2);
    pixels((x,y,d,i)=>{
      const m = .9 + .2*fbm(x,y,140*k,140*k,T,3,7), n = (hash(x,y,3)-.5)*26, sp = hash(x,y,11)>.9975 ? 70 : 0;
      d[i]=clamp(d[i]*m+n+sp); d[i+1]=clamp(d[i+1]*m+n+sp); d[i+2]=clamp(d[i+2]*m+n+sp);
    });
  } else if(id==="granite-red"){
    crystals("#8a5245", [[.34,"#b8644f"],[.14,"#d48b72"],[.2,"#6d6662"],[.16,"#151313"],[.16,"#a9a19a"]], .042, 1.4, 5);
    pixels((x,y,d,i)=>{
      const m = .88 + .24*fbm(x,y,160*k,160*k,T,3,9), n = (hash(x,y,5)-.5)*24;
      d[i]=clamp(d[i]*m+n); d[i+1]=clamp(d[i+1]*m+n); d[i+2]=clamp(d[i+2]*m+n);
    });
  } else if(id==="marble"){
    pixels((x,y,d,i)=>{
      const t = fbm(x,y,260*k,260*k,T,5,21), t2 = fbm(x,y,90*k,90*k,T,3,31);
      const v = Math.abs(Math.sin(x/(120*k) + t*4.5));
      const vein = Math.pow(1-v, 30)*.75 + Math.pow(1-Math.abs(Math.sin(x/(37*k)+t2*6)),60)*.35;
      const cloud = .9 + .1*t - .05*t2, n=(hash(x,y,4)-.5)*6;
      d[i]=clamp(236*cloud - vein*150 + n); d[i+1]=clamp(233*cloud - vein*148 + n); d[i+2]=clamp(227*cloud - vein*140 + n); d[i+3]=255;
    });
  } else if(id==="concrete"){
    pixels((x,y,d,i)=>{
      const big = fbm(x,y,220*k,220*k,T,4,41), mid = fbm(x,y,18*k,18*k,T,2,43);
      let v = 150 + (big-.5)*50 + (mid-.5)*30 + (hash(x,y,44)-.5)*34;
      const pore = pnoise(x,y,3*k,3*k,T,45);
      if(pore>.86) v -= (pore-.86)*500;
      if(hash(x,y,46)>.996) v += 40;
      d[i]=clamp(v+2); d[i+1]=clamp(v); d[i+2]=clamp(v-5); d[i+3]=255;
    });
  } else if(id==="wood"){
    const rings = Math.max(4, Math.round(T/(26*k)));
    pixels((x,y,d,i)=>{
      const w = fbm(x,y,400*k,120*k,T,3,51);
      const ph = (y/T)*rings*Math.PI*2 + w*7 + x/(900*k);
      const r = Math.pow(.5+.5*Math.sin(ph), 2.4), fib = pnoise(x,y,60*k,1.6*k,T,53);
      const t = r*.75 + fib*.25, n=(hash(x,y,52)-.5)*8;
      d[i]=clamp(176 - t*80 + n); d[i+1]=clamp(124 - t*62 + n); d[i+2]=clamp(78 - t*44 + n); d[i+3]=255;
    });
  } else if(id==="barrel"){
    const st = matById(id).bumps, sh = T/st;
    const hoops = [[.13,.05],[.87,.05]];
    const tones = Array.from({length:st},(_,i)=>.85+.3*hash(i,0,81));
    pixels((x,y,d,i)=>{
      const si = Math.floor(y/sh)%st, f = (y%sh)/sh;
      const grain = fbm(x,y,300*k,6*k,T,3,82), fib = pnoise(x,y,80*k,1.5*k,T,83);
      let t = tones[si]*(.8+.35*grain) - fib*.12;
      const edge = Math.min(f,1-f);
      if(edge<.035) t *= .35 + .65*edge/.035;
      let r=150*t+18, g2=100*t+8, b=58*t;
      const u = x/W;
      for(const [c,hw] of hoops){
        const dx = Math.abs(u-c);
        if(dx<hw){
          const p = dx/hw;
          const v = 52 + 38*Math.cos(p*Math.PI/2) + (hash(x,y,84)-.5)*16, rust = fbm(x,y,30*k,30*k,T,3,85);
          r = v + rust*30; g2 = v*.92 + rust*12; b = v*.85;
          if(p>.86){ r*=.45; g2*=.45; b*=.45; }
          const ry=(y/sh)%1, rr=Math.hypot((u-c)*W, (ry-.5)*sh)/(2.2*k);
          if(rr<1){ const l=1-rr; r+=55*l; g2+=50*l; b+=45*l; }
        } else if(dx<hw*1.35){ const s=.55+.45*(dx-hw)/(hw*.35); r*=s; g2*=s; b*=s; }
      }
      d[i]=clamp(r); d[i+1]=clamp(g2); d[i+2]=clamp(b); d[i+3]=255;
    });
  } else if(id==="cork"){
    crystals("#b48a5c", [[.35,"#c99c6a"],[.3,"#9a7048"],[.2,"#d8b384"],[.15,"#6e4c2e"]], .09, .8, 2.6);
    pixels((x,y,d,i)=>{
      const m = .9 + .18*fbm(x,y,60*k,60*k,T,3,91), pit = hash(x,y,92)>.993 ? -60 : 0, n=(hash(x,y,93)-.5)*18;
      d[i]=clamp(d[i]*m+n+pit); d[i+1]=clamp(d[i+1]*m+n+pit); d[i+2]=clamp(d[i+2]*m+n*.8+pit);
    });
  } else if(id==="felt"){
    pixels((x,y,d,i)=>{
      const a = fbm(x,y,2.5*k,2.5*k,T,2,101), b2 = fbm(x,y,90*k,90*k,T,3,102);
      const v = .86 + (a-.5)*.16 + (b2-.5)*.1 + (hash(x,y,103)-.5)*.07;
      d[i]=clamp(176*v); d[i+1]=clamp(160*v); d[i+2]=clamp(134*v); d[i+3]=255;
    });
  } else if(id==="leather"){
    const seamY = T*.5;
    pixels((x,y,d,i)=>{
      const p = pnoise(x,y,4*k,4*k,T,121), p2 = pnoise(x,y,9*k,9*k,T,122);
      const pebble = Math.pow(Math.abs(p-.5)*2,.6)*.5 + p2*.5, patina = fbm(x,y,200*k,200*k,T,3,123);
      const v = .7 + pebble*.25 + (patina-.5)*.3;
      let r=150*v, g2=86*v, b=44*v;
      const dy = Math.abs(y-seamY);
      if(dy<1.2*k){ r*=.3; g2*=.3; b*=.3; }
      else if(dy>3.5*k && dy<6*k && (x/(6*k))%1<.6){ r=226; g2=208; b=170; }
      d[i]=clamp(r); d[i+1]=clamp(g2); d[i+2]=clamp(b); d[i+3]=255;
    });
  } else if(id==="rope"){
    const n = matById(id).bumps, pitch = T/n, slope = .06;
    pixels((x,y,d,i)=>{
      const u = y + x*slope, f = ((u/pitch)%1+1)%1;
      const prof = Math.sin(f*Math.PI), twist = .5+.5*Math.sin((f*pitch - x*.9)/(1.6*k)*1.1);
      let v = .25 + .75*Math.pow(prof,.7); v *= .78 + .22*twist; v += (hash(x,y,131)-.5)*.18;
      d[i]=clamp(196*v); d[i+1]=clamp(160*v); d[i+2]=clamp(104*v); d[i+3]=255;
    });
  } else if(id==="sandstone"){
    pixels((x,y,d,i)=>{
      const layers = fbm(x,y,500*k,40*k,T,4,141), blot = fbm(x,y,150*k,150*k,T,3,142);
      const sand = (hash(x,y,143)-.5)*36 + (hash(x>>1,y>>1,144)-.5)*16;
      const v = .86 + (layers-.5)*.25 + (blot-.5)*.18;
      d[i]=clamp(206*v+sand); d[i+1]=clamp(168*v+sand); d[i+2]=clamp(118*v+sand*.8); d[i+3]=255;
    });
  } else if(id==="rubber"){
    const ribs = matById(id).bumps;
    pixels((x,y,d,i)=>{
      const ph = (y/T)*ribs, f = ph-Math.floor(ph);
      let s = 0;
      if(f<.18) s = -38*(1-f/.18); else if(f<.32) s = 22*Math.sin((f-.18)/.14*Math.PI);
      const n=(hash(x,y,61)-.5)*14 + (fbm(x,y,80*k,80*k,T,2,62)-.5)*10, v = 44 + s + n;
      d[i]=clamp(v); d[i+1]=clamp(v); d[i+2]=clamp(v+3); d[i+3]=255;
    });
  } else if(id==="steel"){
    pixels((x,y,d,i)=>{
      const brush = pnoise(x,y,240*k,k,T,71)*.6 + pnoise(x,y,60*k,k,T,72)*.4, big = fbm(x,y,300*k,300*k,T,2,73);
      const v = 158 + (brush-.5)*46 + (big-.5)*22 + (hash(x,y,74)-.5)*6;
      d[i]=clamp(v-3); d[i+1]=clamp(v); d[i+2]=clamp(v+6); d[i+3]=255;
    });
  }
  if(matById(id).stone) wear(g, W, T, k, R);
  return cv;
}

// worn stone: scratches around the wheel, grime + chipped edges at both ends
function wear(g, W, T, k, R){
  g.save(); g.lineCap="round";
  const n = Math.round(25 + W/k*.12);
  for(let i=0;i<n;i++){
    const x=R()*W, len=T*(.05+.45*R()), y0=R()*T, light=R()<.65;
    g.strokeStyle = light ? `rgba(255,250,240,${.05+.13*R()})` : `rgba(0,0,0,${.06+.12*R()})`;
    g.lineWidth = (.4+R()*.9)*k;
    for(const oy of (y0+len>T ? [0,-T] : [0])){
      g.beginPath(); let xx=x;
      for(let s=0;s<=12;s++){ xx += (R()-.5)*.8*k; const yy=y0+oy+len*s/12; s?g.lineTo(xx,yy):g.moveTo(xx,yy); }
      g.stroke();
    }
  }
  const gr=g.createLinearGradient(0,0,W,0);
  gr.addColorStop(0,"rgba(22,18,14,.6)"); gr.addColorStop(.08,"rgba(22,18,14,0)");
  gr.addColorStop(.92,"rgba(22,18,14,0)"); gr.addColorStop(1,"rgba(22,18,14,.5)");
  g.fillStyle=gr; g.fillRect(0,0,W,T);
  const chips = Math.round(T/(k*7));
  for(let i=0;i<chips;i++){
    const left=R()<.5, x = left ? R()*W*.035 : W - R()*W*.035, y=R()*T, r=(1+3.5*R())*k;
    g.fillStyle = R()<.6 ? `rgba(255,252,245,${.15+.2*R()})` : `rgba(0,0,0,${.25+.25*R()})`;
    g.beginPath();
    for(let j=0;j<6;j++){ const a=j/6*6.283, rr=r*(.5+.7*R()); const px=x+Math.cos(a)*rr, py=y+Math.sin(a)*rr; j?g.lineTo(px,py):g.moveTo(px,py); }
    g.fill();
  }
  g.restore();
}

// the side face of the wheel (a disc), rotates with the wheel
function makeDisk(m, D, k, tint){
  const faceId = m.face ? "wood" : m.id;
  const base = makeTexture(faceId, D, D, k, tint);
  const cv=document.createElement("canvas"); cv.width=cv.height=D;
  const g=cv.getContext("2d"), r=D/2, R=rng(77+m.id.length);
  g.save(); g.beginPath(); g.arc(r,r,r,0,6.2832); g.clip();
  g.drawImage(base,0,0);
  if(m.face==="lid"){                               // barrel lid: planks + iron ring
    g.fillStyle="rgba(30,18,8,.75)";
    for(let i=1;i<5;i++) g.fillRect(i*D/5-k, 0, 2*k, D);
  }
  if(m.stone){                                      // tool-dressing scratches + chipped rim
    for(let i=0;i<40;i++){
      const rr=r*(.2+.75*R()), a0=R()*6.28;
      g.strokeStyle=`rgba(255,250,240,${.04+.08*R()})`; g.lineWidth=(.4+R())*k;
      g.beginPath(); g.arc(r,r,rr,a0,a0+.4+R()*2); g.stroke();
    }
    for(let i=0;i<70;i++){
      const a=R()*6.283, rr=r*(.93+.07*R()), x=r+Math.cos(a)*rr, y=r+Math.sin(a)*rr, s=(1.5+4*R())*k;
      g.fillStyle = R()<.6 ? `rgba(255,252,245,${.15+.2*R()})` : `rgba(0,0,0,${.3+.3*R()})`;
      g.beginPath(); g.ellipse(x,y,s,s*.6,a,0,6.283); g.fill();
    }
  }
  const gr=g.createRadialGradient(r,r,r*.75,r,r,r);   // grime toward the rim
  gr.addColorStop(0,"rgba(0,0,0,0)"); gr.addColorStop(1,"rgba(0,0,0,.45)");
  g.fillStyle=gr; g.fillRect(0,0,D,D);
  if(m.face==="lid"){
    g.lineWidth=7*k; g.strokeStyle="#3b3732"; g.beginPath(); g.arc(r,r,r-4*k,0,6.283); g.stroke();
    g.fillStyle="#7a736a"; for(let i=0;i<12;i++){ const a=i/12*6.283; g.beginPath(); g.arc(r+Math.cos(a)*(r-4*k), r+Math.sin(a)*(r-4*k), 1.6*k,0,6.283); g.fill(); }
    g.fillStyle="#24170c"; g.beginPath(); g.arc(r, r+r*.55, r*.07, 0, 6.283); g.fill();
    g.strokeStyle="rgba(255,220,170,.25)"; g.lineWidth=1.5*k; g.stroke();
  } else {                                          // steel hub with bolts
    const hr=r*.16, hg=g.createRadialGradient(r-hr*.4,r-hr*.4,hr*.1,r,r,hr);
    hg.addColorStop(0,"#d9dcdf"); hg.addColorStop(.6,"#8d9196"); hg.addColorStop(1,"#4a4d51");
    g.fillStyle="rgba(0,0,0,.4)"; g.beginPath(); g.arc(r,r+hr*.08,hr*1.08,0,6.283); g.fill();
    g.fillStyle=hg; g.beginPath(); g.arc(r,r,hr,0,6.283); g.fill();
    for(let i=0;i<6;i++){ const a=i/6*6.283, bx=r+Math.cos(a)*hr*.66, by=r+Math.sin(a)*hr*.66;
      g.fillStyle="#3d4044"; g.beginPath(); g.arc(bx,by,hr*.13,0,6.283); g.fill();
      g.fillStyle="#b9bcc0"; g.beginPath(); g.arc(bx-hr*.03,by-hr*.03,hr*.07,0,6.283); g.fill(); }
    g.fillStyle="#111"; g.beginPath(); g.arc(r,r,hr*.28,0,6.283); g.fill();
  }
  g.restore();
  return cv;
}

/* ---------------- wheel rendering ---------------- */
const field=document.getElementById("field"), cv=document.getElementById("cv"), ctx=cv.getContext("2d",{alpha:false});
const busy=document.getElementById("busy");
let dpr=1, CW=0, CH=0, RAD=1, Lc=1, SA=0, CX=0, CY=0, view3d=true, fieldRect={left:0,top:0};
let rTh=null, rX=null, rW=null, surfPath=null;
let palCol=[[128,128,128]], tex=null, disk=null, shade=null, texCache={}, avgCol=[128,128,128], wellCol="#060708";
let phase=0, vel=0, dirty=true;

function buildShade(){
  const m=matById(S.mat);
  shade=document.createElement("canvas"); shade.width=1; shade.height=CH;
  const g=shade.getContext("2d"), im=g.createImageData(1,CH), d=im.data;
  for(let y=0;y<CH;y++){
    if(!rW[y]) continue;
    const th=rTh[y];
    let diff = .2 + .8*Math.max(0,Math.cos(th+.42));
    if(m.sheen) diff = diff*(1-m.sheen*.5) + m.sheen*1.6*Math.pow(Math.abs(Math.sin(th)),2.5);
    let spec = m.gloss*Math.pow(Math.max(0,Math.cos(th+.21)), m.shine);
    if(diff>1){ spec += (diff-1)*.35; diff = 1; }
    const a = Math.min(1, (1-diff) + spec), c = a>0 ? Math.min(255, 255*spec/a) : 0;
    d[y*4]=c; d[y*4+1]=c; d[y*4+2]=c*.98; d[y*4+3]=a*255;
  }
  g.putImageData(im,0,0);
}

function ensureTexture(){
  const m=matById(S.mat), tint = m.tint ? S.tint[m.id] : "";
  const W=Math.max(120, Math.round(Lc)), k=W/(2*Lc/dpr), T=Math.round(2*Math.PI*RAD*W/(2*Lc));
  const key=m.id+"|"+tint+"|"+W+"|"+T;
  if(!texCache[key]){
    const t=makeTexture(m.id, W, T, k, tint);
    const out=document.createElement("canvas"); out.width=W; out.height=T+3;     // wrap rows
    const o=out.getContext("2d"); o.drawImage(t,0,0); o.drawImage(t,0,T); out.period=T;
    const s=document.createElement("canvas"); s.width=s.height=1; const sg=s.getContext("2d");
    sg.drawImage(t,0,0,W,T,0,0,1,1); out.avg=[...sg.getImageData(0,0,1,1).data.slice(0,3)];
    const px=t.getContext("2d").getImageData(0,0,W,Math.min(T,64)).data; out.pal=[];   // colours for flying bits
    for(let i=0;i<48;i++){ const j=4*Math.floor(Math.random()*px.length/4); out.pal.push([px[j],px[j+1],px[j+2]]); }
    texCache[key]=out;
  }
  tex=texCache[key]; avgCol=tex.avg; palCol=tex.pal;
  if(view3d){
    const D=Math.max(128,Math.min(720,Math.round(RAD))), kd=D/(2*RAD/dpr), dk="disk|"+key+"|"+D;
    if(!texCache[dk]) texCache[dk]=makeDisk(m, D, kd, tint);
    disk=texCache[dk];
  }
}

function resize(){
  const r=field.getBoundingClientRect();
  if(!r.width) return;
  fieldRect=r;
  dpr=Math.min(window.devicePixelRatio||1, 2);
  CW=Math.round(r.width*dpr); CH=Math.round(r.height*dpr);
  cv.width=CW; cv.height=CH; CX=CW/2; CY=CH/2;
  view3d = false;
  if(view3d){
    const a=.24; SA=Math.sin(a); const ca=Math.cos(a), span=CW*.86;
    RAD=Math.min(CH*.44, span/(2*SA + .8*ca));
    Lc=(span - 2*RAD*SA)/2;
  } else { SA=0; RAD=(CH/2)/Math.sin(1.3); Lc=CW/2; }
  rTh=new Float32Array(CH); rX=new Float32Array(CH); rW=new Float32Array(CH);
  for(let y=0;y<CH;y++){
    const Y=y+.5-CY; if(Math.abs(Y)>=RAD) continue;
    const w=Math.sqrt(RAD*RAD-Y*Y);
    rTh[y]=Math.asin(Y/RAD); rX[y]=CX-Lc-w*SA; rW[y]=2*Lc;
  }
  surfPath=new Path2D();
  if(view3d){
    surfPath.ellipse(CX-Lc, CY, RAD*SA, RAD, 0, -Math.PI/2, Math.PI/2, true);   // back silhouette (left half)
    surfPath.ellipse(CX+Lc, CY, RAD*SA, RAD, 0, Math.PI/2, Math.PI*1.5, false); // edge to the side face
    surfPath.closePath();
  } else surfPath.rect(0,0,CW,CH);
  busy.style.display="grid";
  requestAnimationFrame(()=>{ texCache={}; ensureTexture(); buildShade(); busy.style.display="none"; dirty=true; });
}

function draw(){
  if(!tex) return;
  const T=tex.period, W=tex.width, f=T/(2*Math.PI), m=matById(S.mat);
  ctx.fillStyle=wellCol; ctx.fillRect(0,0,CW,CH);
  if(view3d){                                     // soft floor shadow
    ctx.save(); ctx.translate(CX, CY+RAD*.98); ctx.scale(1,.09);
    const rr=(Lc+RAD*SA)*1.2, gr=ctx.createRadialGradient(0,0,0,0,0,rr);
    gr.addColorStop(0,"rgba(0,0,0,.6)"); gr.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=gr; ctx.fillRect(-rr,-rr,rr*2,rr*2); ctx.restore();
  }
  ctx.imageSmoothingEnabled=true;
  for(let y=0;y<CH;y++){
    if(!rW[y]) continue;
    let v=(phase+rTh[y])*f; v%=T; if(v<0) v+=T;
    ctx.drawImage(tex, 0, v, W, 1, rX[y], y, rW[y], 1.25);
  }
  ctx.save(); ctx.clip(surfPath);
  ctx.drawImage(shade, 0, 0, 1, CH, 0, 0, CW, CH);
  if(view3d){                                     // rounded far edge
    ctx.strokeStyle="rgba(0,0,0,.28)";
    for(const lw of [16,8,3]){ ctx.lineWidth=lw*dpr; ctx.beginPath(); ctx.ellipse(CX-Lc,CY,RAD*SA,RAD,0,Math.PI/2,Math.PI*1.5); ctx.stroke(); }
  }
  ctx.restore();
  if(view3d && disk){
    const fx=CX+Lc, rx=RAD*SA;
    ctx.save(); ctx.beginPath(); ctx.ellipse(fx,CY,rx,RAD,0,0,Math.PI*2); ctx.clip();
    ctx.translate(fx,CY); ctx.scale(SA,1); ctx.rotate(phase);
    ctx.drawImage(disk,-RAD,-RAD,RAD*2,RAD*2);
    ctx.restore();
    ctx.save(); ctx.beginPath(); ctx.ellipse(fx,CY,rx,RAD,0,0,Math.PI*2);
    const fg=ctx.createLinearGradient(0,CY-RAD,0,CY+RAD);
    fg.addColorStop(0,"rgba(0,0,0,.12)"); fg.addColorStop(.5,"rgba(0,0,0,.34)"); fg.addColorStop(1,"rgba(0,0,0,.62)");
    ctx.fillStyle=fg; ctx.fill(); ctx.restore();
    // worn, rounded edge between tread and side catches the light
    const bev=.25+m.gloss*.5+(m.stone?.12:0);
    const bg=ctx.createLinearGradient(0,CY-RAD,0,CY+RAD);
    bg.addColorStop(0,`rgba(255,250,240,${bev})`); bg.addColorStop(.45,`rgba(255,250,240,${bev*.35})`); bg.addColorStop(1,"rgba(255,250,240,0)");
    ctx.strokeStyle=bg; ctx.lineWidth=2.6*dpr;
    ctx.beginPath(); ctx.ellipse(fx,CY,rx,RAD,0,Math.PI/2,Math.PI*1.5); ctx.stroke();
    ctx.strokeStyle="rgba(0,0,0,.55)"; ctx.lineWidth=1.5*dpr;
    ctx.beginPath(); ctx.ellipse(fx,CY,rx,RAD,0,-Math.PI/2,Math.PI/2); ctx.stroke();
  }
}

/* ---------------- particles (sparks / glitter / dust) ---------------- */
const fxCv=document.getElementById("fx"), fxc=fxCv.getContext("2d");
let parts=[], emitAcc=0, fxDirty=false, fxDpr=1;
function sizeFx(){ fxDpr=Math.min(window.devicePixelRatio||1,2); fxCv.width=innerWidth*fxDpr; fxCv.height=innerHeight*fxDpr; }
function spawn(n){
  const sp=Math.abs(vel), dirY = vel>0 ? -1 : 1, mfx=fxType();
  for(let i=0;i<n && parts.length<700;i++){
    const side = Math.random()<.5 ? -1 : 1, Y=(Math.random()*2-1)*.92*RAD, w=Math.sqrt(RAD*RAD-Y*Y);
    let xc;
    if(view3d) xc = side<0 ? CX-Lc-w*SA : CX+Lc+w*SA;
    else { if(Math.abs(Y)>CH/2) continue; xc = side<0 ? 2 : CW-2; }
    let type=mfx;
    if(mfx==="stone") type = Math.random()<.7 ? "grit" : "dust";
    if(mfx==="sand") type = Math.random()<.45 ? "grit" : "dust";
    if(mfx==="powder") type = Math.random()<.2 ? "grit" : "dust";
    const p={type, x:fieldRect.left+xc/dpr, y:fieldRect.top+(CY+Y)/dpr, life:0, r:Math.random()};
    if(type==="sparks"){ p.vx=side*(80+320*p.r)*(.5+sp/2500); p.vy=dirY*sp*(.25+.55*Math.random())+(Math.random()-.5)*120; p.max=.3+.5*Math.random(); }
    else if(type==="glitter"){ p.vx=side*(40+200*p.r); p.vy=dirY*sp*(.15+.35*Math.random()); p.max=.9+.9*Math.random();
      p.hue=Math.random()*360; p.size=1.5+2.5*Math.random(); p.rot=Math.random()*6; p.spin=(Math.random()-.5)*20; }
    else if(type==="grit"||type==="crumbs"){ const big=type==="crumbs"; p.vx=side*(60+260*p.r)*(.5+sp/2500); p.vy=dirY*sp*(.2+.5*Math.random())+(Math.random()-.5)*80;
      p.max=.5+.6*Math.random(); p.size=big?2+2.5*Math.random():.8+1.6*Math.random(); p.rot=Math.random()*6; p.spin=(Math.random()-.5)*25;
      p.col=palCol[Math.floor(Math.random()*palCol.length)]; }
    else if(type==="fibers"){ p.vx=side*(30+160*p.r); p.vy=dirY*sp*(.1+.3*Math.random()); p.max=1+.8*Math.random();
      p.size=4+6*Math.random(); p.rot=Math.random()*6; p.spin=(Math.random()-.5)*8; p.col=palCol[Math.floor(Math.random()*palCol.length)]; }
    else { p.vx=side*(20+120*p.r); p.vy=dirY*sp*(.08+.2*Math.random()); p.max=1+Math.random(); p.size=2+3*Math.random(); }
    p.vy=Math.max(-1800,Math.min(1800,p.vy));
    parts.push(p);
  }
}
function stepParts(dt){
  for(const p of parts){
    p.life+=dt;
    if(p.type==="sparks"){ p.vy+=1400*dt; p.vx*=Math.exp(-.8*dt); }
    else if(p.type==="grit"||p.type==="crumbs"){ p.vy+=(p.type==="grit"?1300:900)*dt; p.vx*=Math.exp(-.6*dt); p.rot+=p.spin*dt; }
    else if(p.type==="fibers"){ p.vy+=260*dt; p.vx*=Math.exp(-2*dt); p.vy*=Math.exp(-1.5*dt); p.rot+=p.spin*dt; }
    else if(p.type==="glitter"){ p.vy+=420*dt; p.vx*=Math.exp(-1.6*dt); p.vy*=Math.exp(-1.2*dt); p.rot+=p.spin*dt; }
    else { p.vy-=15*dt; p.vx*=Math.exp(-2.5*dt); p.vy*=Math.exp(-2.5*dt); p.size+=10*dt; }
    p.x+=p.vx*dt; p.y+=p.vy*dt;
  }
  parts=parts.filter(p=>p.life<p.max && p.y<innerHeight+40 && p.x>-40 && p.x<innerWidth+40);
}
function drawParts(){
  fxc.setTransform(1,0,0,1,0,0); fxc.clearRect(0,0,fxCv.width,fxCv.height);
  if(!parts.length) return;
  fxc.setTransform(fxDpr,0,0,fxDpr,0,0);
  const dust=mix(avgCol,[255,255,255],.25);
  for(const p of parts){
    const t=1-p.life/p.max;
    if(p.type==="sparks"){
      fxc.globalCompositeOperation="lighter";
      fxc.strokeStyle=`rgba(255,${Math.round(140+110*t)},${Math.round(60*t*t)},${t})`; fxc.lineWidth=1.6;
      fxc.beginPath(); fxc.moveTo(p.x,p.y); fxc.lineTo(p.x-p.vx*.022,p.y-p.vy*.022); fxc.stroke();
    } else if(p.type==="grit"||p.type==="crumbs"||p.type==="fibers"){
      fxc.globalCompositeOperation="source-over";
      const c=p.col; fxc.fillStyle=`rgba(${c[0]},${c[1]},${c[2]},${Math.min(1,t*1.6)})`;
      fxc.save(); fxc.translate(p.x,p.y); fxc.rotate(p.rot);
      if(p.type==="fibers") fxc.fillRect(-p.size/2,-.45,p.size,.9); else fxc.fillRect(-p.size/2,-p.size*.35,p.size,p.size*.7);
      fxc.restore();
    } else if(p.type==="glitter"){
      fxc.globalCompositeOperation="lighter";
      const tw=.45+.55*Math.abs(Math.sin(p.life*14+p.r*9));
      fxc.fillStyle=`hsla(${p.hue},90%,68%,${t*tw})`;
      fxc.save(); fxc.translate(p.x,p.y); fxc.rotate(p.rot); fxc.fillRect(-p.size/2,-p.size/2,p.size,p.size*.6); fxc.restore();
    } else {
      fxc.globalCompositeOperation="source-over";
      fxc.fillStyle=`rgba(${dust[0]},${dust[1]},${dust[2]},${.32*t})`;
      fxc.beginPath(); fxc.arc(p.x,p.y,p.size,0,6.283); fxc.fill();
    }
  }
  fxc.globalCompositeOperation="source-over";
}

// what flies off: colour wheel = user's choice, other materials = their own bits (or nothing)
function fxType(){ const m=matById(S.mat); if(m.id==="solid") return S.fx==="none"?null:S.fx; return m.fx||null; }

/* ---------------- wheel input ---------------- */
let dragging=false, pid=null, lastY=0, accDy=0, fingerV=0;
field.addEventListener("pointerdown", e=>{
  if(pid!==null) return;
  pid=e.pointerId; dragging=true; lastY=e.clientY; accDy=0; fingerV=0;
  field.setPointerCapture(pid); field.classList.add("drag"); audioInit();
});

const upRoll = e=>{ if(e.pointerId!==pid) return; dragging=false; pid=null; field.classList.remove("drag"); };
field.addEventListener("pointerup", upRoll); field.addEventListener("pointercancel", upRoll);

/* ---------------- sound ---------------- */
let AC=null, master=null, srcs={}, chain=null, whine=null, burstBuf=null;
function audioInit(){
  if(AC){ if(AC.state==="suspended") AC.resume(); return; }
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain(); master.gain.value=.9; master.connect(AC.destination);
    const mk = brown => {
      const len=AC.sampleRate*3, buf=AC.createBuffer(1,len,AC.sampleRate), ch=buf.getChannelData(0);
      let last=0;
      for(let i=0;i<len;i++){ const w=Math.random()*2-1; if(brown){ last=(last+.04*w)/1.02; ch[i]=last*4.5; } else ch[i]=w*.6; }
      const s=AC.createBufferSource(); s.buffer=buf; s.loop=true; s.start(); return s;
    };
    srcs.white=mk(false); srcs.brown=mk(true);
    burstBuf=AC.createBuffer(1,AC.sampleRate*.05,AC.sampleRate);
    const b=burstBuf.getChannelData(0); for(let i=0;i<b.length;i++) b[i]=(Math.random()*2-1)*Math.exp(-i/(b.length*.15));
    buildChain();
  }catch(e){ AC=null; }
}
function buildChain(){
  if(!AC) return;
  if(chain){ chain.src.disconnect(); chain.out.disconnect(); }
  if(whine){ whine.o.stop(); whine.g.disconnect(); whine=null; }
  const sn=matById(S.mat).snd, src=srcs[sn.src]; let node=src; const filters=[];
  for(const [type,f,q,gain] of sn.f){
    const fl=AC.createBiquadFilter(); fl.type=type; fl.frequency.value=f; fl.Q.value=q; if(gain) fl.gain.value=gain;
    node.connect(fl); node=fl; filters.push([fl,f]);
  }
  const out=AC.createGain(); out.gain.value=0; node.connect(out); out.connect(master);
  chain={src, out, filters};
  if(sn.whine){ const o=AC.createOscillator(), g=AC.createGain(); o.type="sine"; g.gain.value=0; o.connect(g); g.connect(master); o.start(); whine={o,g}; }
}
function oneShot(kind, gain){
  if(!AC || !S.sound) return;
  const t=AC.currentTime, g=AC.createGain(); g.connect(master);
  const noise = (type,f,q,dur) => {
    const s=AC.createBufferSource(); s.buffer=burstBuf; s.playbackRate.value=.7+Math.random()*.6;
    const fl=AC.createBiquadFilter(); fl.type=type; fl.frequency.value=f; fl.Q.value=q;
    s.connect(fl); fl.connect(g); s.start(t); s.stop(t+dur);
  };
  const tone = (type,f,dur) => {
    const o=AC.createOscillator(); o.type=type; o.frequency.setValueAtTime(f,t); o.frequency.exponentialRampToValueAtTime(f*.7,t+dur);
    o.connect(g); o.start(t); o.stop(t+dur);
  };
  let dur=.05;
  if(kind==="knock"){ tone("sine",140+Math.random()*30,.09); noise("bandpass",900,1.5,.04); dur=.09; }
  else if(kind==="thud"){ tone("sine",75,.06); dur=.06; }
  else if(kind==="fiber"){ noise("bandpass",2200,1.2,.02); dur=.02; }
  else if(kind==="grain"){ noise("highpass",2500+Math.random()*3000,.7,.012); dur=.012; }
  else if(kind==="press"){ const hi=S.padStyle==="light"; tone("sine",hi?230:170,.035); noise("highpass",hi?3600:2800,.8,.012); dur=.04; }
  else if(kind==="release"){ noise("bandpass",S.padStyle==="light"?2600:1900,1.2,.01); dur=.015; }
  else { tone("triangle",1400,.03); dur=.03; }
  g.gain.setValueAtTime(gain,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
}
const buzz = ms => { if(S.haptics && navigator.vibrate) navigator.vibrate(ms||4); };

/* ---------------- main loop ---------------- */
let lastT=performance.now(), lastDetent=0, lastTickAt=0, lastBump=0, lastBumpAt=0, lastStatsAt=0, sheetOpen=false;
const DETENTS=24;
function frame(now){
  const dt=Math.min(.05,(now-lastT)/1000); lastT=now;
  const m=matById(S.mat), roll=S.mode==="roll";
  if(dt>0){
    if(dragging){
      const raw=-accDy/dt; accDy=0;
      fingerV += (raw-fingerV)*.55;
      vel += (fingerV-vel)*(1-Math.exp(-dt/(m.mass*.025)));
    } else {
      vel *= Math.exp(-m.k*dt);
      const dec=m.c*dt; vel = Math.abs(vel)<=dec ? 0 : vel-Math.sign(vel)*dec;
    }
    vel=Math.max(-9000,Math.min(9000,vel));
    if(vel!==0){ const dp=vel*dt*dpr/RAD; phase+=dp; STATS.turns+=Math.abs(dp)/(2*Math.PI); dirty=true; }
  }
  const sp=Math.abs(vel), sn=m.snd;
  if(m.bumps){
    const b=Math.floor(phase/(2*Math.PI/m.bumps));
    if(b!==lastBump){
      const rate=sp*dpr/RAD*m.bumps/(2*Math.PI);
      if(rate<28 && now-lastBumpAt>30){ oneShot(sn.bump, sn.bumpG*Math.min(1,.35+sp/900)); lastBumpAt=now; if(!S.ticks && m.id==="barrel") buzz(); }
      lastBump=b;
    }
  }
  const det=Math.floor(phase/(2*Math.PI/DETENTS));
  if(det!==lastDetent){ if(S.ticks && now-lastTickAt>25){ oneShot("click",.1); buzz(); lastTickAt=now; } lastDetent=det; }
  if(sn.crackle && sp>30 && Math.random() < sn.crackle*Math.min(1,sp/1200)*dt*40) oneShot("grain", .05+.1*Math.random()*Math.min(1,sp/1500));
  if(AC && chain){
    const t=AC.currentTime, lvl=Math.min(1,Math.pow(sp/1400,.75));
    chain.out.gain.setTargetAtTime(S.sound ? sn.g*lvl*(dragging?1.1:1) : 0, t, .04);
    for(const [fl,f] of chain.filters) if(fl.type!=="peaking") fl.frequency.setTargetAtTime(f*(1-sn.pitch*.45+Math.min(2,sp/1500)*sn.pitch*.7), t, .05);
    if(whine){ whine.o.frequency.setTargetAtTime(180+sp*.22, t, .05); whine.g.gain.setTargetAtTime(S.sound? sn.whine*Math.min(1,sp/600):0, t, .08); }
  }
  // particles: only when spinning fast
  if(roll && fxType() && sp>280){ emitAcc += dt*(sp-280)*.12; const n=Math.floor(emitAcc); if(n){ emitAcc-=n; spawn(n); } }
  if(parts.length || fxDirty){ stepParts(dt); drawParts(); fxDirty=parts.length>0; }
  if(roll && dirty){ draw(); dirty=false; }
  if(sheetOpen && now-lastStatsAt>300){ lastStatsAt=now; showStats(); }
  requestAnimationFrame(frame);
}

/* ---------------- button pad ---------------- */
const pad=document.getElementById("pad"), downMap=new Map();
function buildPad(){
  const n=+S.grid; pad.innerHTML=""; pad.className=S.padStyle;
  pad.style.setProperty("--n",n);
  pad.style.setProperty("--gap", (n<=3?14:n<=5?10:7)+"px");
  pad.style.setProperty("--bw", Math.max(2, 6-n*.5)+"px");
  for(let i=0;i<n*n;i++){
    const b=document.createElement("button"); b.className="pb"; b.dataset.i=i; b.setAttribute("aria-label","Tlačítko");
    b.innerHTML='<span class="glow"></span><span class="halo"></span>'; pad.append(b);
  }
  requestAnimationFrame(sizePad);
}
function sizePad(){
  const n=+S.grid, cs=getComputedStyle(pad), gap=parseFloat(cs.getPropertyValue("--gap"))||10;
  const room=Math.min(pad.clientWidth, pad.clientHeight) - gap*2 - gap*(n-1);
  const cell=Math.floor(room/n);
  pad.style.setProperty("--cell", cell+"px");
  pad.style.setProperty("--r", Math.round(cell*.2)+"px");
}
function lightColor(){
  if(S.light==="rainbow"){ const h=Math.random()*360, c=hsl(h,.9,.62); return c.join(","); }
  return hex2rgb(S.light).join(",");
}
function hsl(h,s,l){ const f=n=>{ const k=(n+h/30)%12, a=s*Math.min(l,1-l); return Math.round(255*(l-a*Math.max(-1,Math.min(k-3,9-k,1)))); }; return [f(0),f(8),f(4)]; }
function flash(b, a, delay){
  for(const el of b.children) el.animate([{opacity:0},{opacity:a, offset:.07},{opacity:0}], {duration:1500, delay, easing:"ease-out"});
}
function press(b){
  audioInit(); STATS.clicks++;
  oneShot("press",.22); buzz(6);
  const col=lightColor();
  if(S.padMode==="toggle"){
    if(b.classList.contains("on")) b.classList.remove("on");
    else { b.style.setProperty("--lc",col); b.classList.add("on"); }
  } else { b.style.setProperty("--lc",col); flash(b,1,0); }
  if(S.wave){
    const n=+S.grid, i=+b.dataset.i, x=i%n, y=Math.floor(i/n);
    for(const nb of pad.children){
      const j=+nb.dataset.i, d=Math.max(Math.abs(j%n-x), Math.abs(Math.floor(j/n)-y));
      if(!d || d>2 || nb.classList.contains("on")) continue;
      nb.style.setProperty("--lc",col); flash(nb, d===1?.42:.16, d*70);
    }
  }
}
pad.addEventListener("pointerdown", e=>{
  const b=e.target.closest(".pb"); if(!b) return;
  e.preventDefault(); downMap.set(e.pointerId,b); b.classList.add("down"); press(b);
});
const upPad = e=>{ const b=downMap.get(e.pointerId); if(!b) return; downMap.delete(e.pointerId); b.classList.remove("down"); oneShot("release",.12); };

    if(k==="view") resize();
    if(k==="grid" || k==="padStyle") buildPad();
    if(k==="padMode") pad.querySelectorAll(".pb.on").forEach(x=>x.classList.remove("on"));
  });
  mark();
});
document.querySelectorAll(".sw").forEach(sw=>{
  const k=sw.dataset.k; sw.checked=!!S[k];
  sw.onchange=()=>{ S[k]=sw.checked; save(); if(sw.checked) audioInit(); };
});

let rt; window.addEventListener("resize", ()=>{ clearTimeout(rt); rt=setTimeout(()=>{ sizeFx(); if(S.mode==="roll") resize(); else sizePad(); },150); });
applyTheme(); renderMats(); buildPad(); sizeFx(); setMode(S.mode); applyMat(); resize();
requestAnimationFrame(frame);

if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js");
</script>
